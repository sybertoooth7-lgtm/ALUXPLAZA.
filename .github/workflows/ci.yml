name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 20
      - run: cd frontend && npm ci && npm run lint
      - run: cd backend && npm ci && npm run lint

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 20
      - run: cd frontend && npm ci && npx tsc --noEmit

  test-backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: alux
          POSTGRES_PASSWORD: password
          POSTGRES_DB: alux_plaza
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 20
      - run: cd backend && npm ci
      - run: cd backend && cp .env.example .env
      - run: cd backend && sed -i 's|DATABASE_URL=.*|DATABASE_URL=postgresql://alux:password@localhost:5432/alux_plaza|' .env
      - run: cd backend && sed -i 's/JWT_SECRET=.*/JWT_SECRET=ci-test-secret-123456789012345678901234567890/' .env
      - run: cd backend && sed -i 's/NODE_ENV=.*/NODE_ENV=development/' .env
      - run: cd backend && npm run test:coverage

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v6
        with:
          files: backend/coverage/lcov.info
          flags: backend
          fail_ci_if_error: false # a Codecov hiccup shouldn't fail the whole CI run
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 20
      - run: cd frontend && npm ci && npm audit --audit-level=high
      - run: cd backend && npm ci && npm audit --audit-level=high
