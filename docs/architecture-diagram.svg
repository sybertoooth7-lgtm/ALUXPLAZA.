<svg viewBox="0 0 980 620" xmlns="http://www.w3.org/2000/svg" font-family="Inter, -apple-system, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#00d4ff"/>
    </marker>
    <marker id="arrow-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="rgba(255,255,255,0.35)"/>
    </marker>
  </defs>

  <rect width="980" height="620" fill="#050a12"/>

  <text x="490" y="38" text-anchor="middle" fill="#c9a84c" font-size="20" font-weight="600" font-family="'Playfair Display', serif">ALUX PLAZA — Architecture</text>
  <text x="490" y="60" text-anchor="middle" fill="rgba(255,255,255,0.4)" font-size="12">Request/data flow across deployment targets</text>

  <!-- Browser -->
  <g>
    <rect x="60" y="100" width="180" height="70" rx="12" fill="#0a1628" stroke="rgba(255,255,255,0.15)"/>
    <text x="150" y="128" text-anchor="middle" fill="#fff" font-size="14" font-weight="600">Client Browser</text>
    <text x="150" y="146" text-anchor="middle" fill="rgba(255,255,255,0.45)" font-size="11">Client portal or admin</text>
    <text x="150" y="160" text-anchor="middle" fill="rgba(255,255,255,0.45)" font-size="11">dashboard, installed as PWA</text>
  </g>

  <!-- Vercel -->
  <g>
    <rect x="60" y="230" width="180" height="110" rx="12" fill="#0a1628" stroke="#00d4ff" stroke-width="1.5"/>
    <text x="150" y="256" text-anchor="middle" fill="#00d4ff" font-size="14" font-weight="700">Vercel</text>
    <text x="150" y="276" text-anchor="middle" fill="rgba(255,255,255,0.7)" font-size="11">React 19 + Vite SPA</text>
    <text x="150" y="292" text-anchor="middle" fill="rgba(255,255,255,0.7)" font-size="11">Service worker (PWA,</text>
    <text x="150" y="306" text-anchor="middle" fill="rgba(255,255,255,0.7)" font-size="11">app-shell cache only)</text>
    <text x="150" y="324" text-anchor="middle" fill="rgba(255,255,255,0.45)" font-size="10">jinarous.vercel.app</text>
  </g>

  <!-- Render -->
  <g>
    <rect x="400" y="230" width="200" height="150" rx="12" fill="#0a1628" stroke="#c9a84c" stroke-width="1.5"/>
    <text x="500" y="256" text-anchor="middle" fill="#c9a84c" font-size="14" font-weight="700">Render</text>
    <text x="500" y="276" text-anchor="middle" fill="rgba(255,255,255,0.7)" font-size="11">Express (ESM) API</text>
    <text x="500" y="292" text-anchor="middle" fill="rgba(255,255,255,0.7)" font-size="11">JWT auth · CSRF · shield</text>
    <text x="500" y="308" text-anchor="middle" fill="rgba(255,255,255,0.7)" font-size="11">scanner · Postgres-backed</text>
    <text x="500" y="324" text-anchor="middle" fill="rgba(255,255,255,0.7)" font-size="11">rate limiting</text>
    <text x="500" y="344" text-anchor="middle" fill="rgba(255,255,255,0.45)" font-size="10">Daily cleanup jobs ·</text>
    <text x="500" y="358" text-anchor="middle" fill="rgba(255,255,255,0.45)" font-size="10">graceful shutdown</text>
    <text x="500" y="374" text-anchor="middle" fill="rgba(255,255,255,0.45)" font-size="10">optional cluster mode</text>
  </g>

  <!-- Neon -->
  <g>
    <rect x="740" y="230" width="180" height="110" rx="12" fill="#0a1628" stroke="rgba(0,255,136,0.6)" stroke-width="1.5"/>
    <text x="830" y="256" text-anchor="middle" fill="#00ff88" font-size="14" font-weight="700">Neon</text>
    <text x="830" y="276" text-anchor="middle" fill="rgba(255,255,255,0.7)" font-size="11">Postgres — the only</text>
    <text x="830" y="292" text-anchor="middle" fill="rgba(255,255,255,0.7)" font-size="11">datastore (no Redis)</text>
    <text x="830" y="312" text-anchor="middle" fill="rgba(255,255,255,0.45)" font-size="10">Auth, sessions, rate</text>
    <text x="830" y="326" text-anchor="middle" fill="rgba(255,255,255,0.45)" font-size="10">limits, compliance data,</text>
    <text x="830" y="340" text-anchor="middle" fill="rgba(255,255,255,0.45)" font-size="10">security events</text>
  </g>

  <!-- Resend -->
  <g>
    <rect x="400" y="450" width="200" height="80" rx="12" fill="#0a1628" stroke="rgba(255,255,255,0.15)"/>
    <text x="500" y="476" text-anchor="middle" fill="#fff" font-size="13" font-weight="600">Resend</text>
    <text x="500" y="494" text-anchor="middle" fill="rgba(255,255,255,0.45)" font-size="10">Transactional email</text>
    <text x="500" y="508" text-anchor="middle" fill="rgba(255,255,255,0.45)" font-size="10">(verify, reset — link-validated)</text>
  </g>

  <!-- Sentry -->
  <g>
    <rect x="640" y="450" width="200" height="80" rx="12" fill="#0a1628" stroke="rgba(255,255,255,0.15)"/>
    <text x="740" y="476" text-anchor="middle" fill="#fff" font-size="13" font-weight="600">Sentry</text>
    <text x="740" y="494" text-anchor="middle" fill="rgba(255,255,255,0.45)" font-size="10">Error tracking, backend + frontend</text>
    <text x="740" y="508" text-anchor="middle" fill="rgba(255,255,255,0.45)" font-size="10">(localhost events filtered client-side)</text>
  </g>

  <!-- GitHub Actions -->
  <g>
    <rect x="60" y="450" width="220" height="100" rx="12" fill="#0a1628" stroke="rgba(255,255,255,0.15)"/>
    <text x="170" y="476" text-anchor="middle" fill="#fff" font-size="13" font-weight="600">GitHub Actions</text>
    <text x="170" y="494" text-anchor="middle" fill="rgba(255,255,255,0.45)" font-size="10">CI: lint, typecheck, tests,</text>
    <text x="170" y="508" text-anchor="middle" fill="rgba(255,255,255,0.45)" font-size="10">CodeQL, gitleaks, coverage,</text>
    <text x="170" y="522" text-anchor="middle" fill="rgba(255,255,255,0.45)" font-size="10">Sentry source-map upload</text>
  </g>

  <!-- Arrows: browser <-> vercel -->
  <line x1="150" y1="170" x2="150" y2="228" stroke="#00d4ff" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="205" y="203" fill="rgba(255,255,255,0.4)" font-size="10">HTTPS</text>

  <!-- vercel -> render -->
  <line x1="240" y1="290" x2="398" y2="290" stroke="#00d4ff" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="320" y="278" text-anchor="middle" fill="rgba(255,255,255,0.4)" font-size="10">fetch() + CSRF</text>
  <text x="320" y="305" text-anchor="middle" fill="rgba(255,255,255,0.4)" font-size="9">cross-origin, cookie auth</text>

  <!-- render -> neon -->
  <line x1="600" y1="300" x2="738" y2="300" stroke="#00ff88" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="669" y="290" text-anchor="middle" fill="rgba(255,255,255,0.4)" font-size="10">pg</text>

  <!-- render -> resend -->
  <line x1="500" y1="380" x2="500" y2="448" stroke="rgba(255,255,255,0.35)" stroke-width="1.5" marker-end="url(#arrow-muted)"/>

  <!-- render -> sentry -->
  <line x1="590" y1="360" x2="720" y2="448" stroke="rgba(255,255,255,0.35)" stroke-width="1.5" marker-end="url(#arrow-muted)"/>

  <!-- vercel -> sentry (frontend errors) -->
  <!-- omitted: Sentry's box text already covers "backend + frontend" -->

  <!-- github actions -> vercel + render (deploys), routed to fan out without crossing -->
  <path d="M 170 448 C 170 395, 160 370, 152 342" fill="none" stroke="rgba(255,255,255,0.25)" stroke-width="1.3" stroke-dasharray="4 3" marker-end="url(#arrow-muted)"/>
  <path d="M 265 448 C 340 410, 420 400, 462 384" fill="none" stroke="rgba(255,255,255,0.25)" stroke-width="1.3" stroke-dasharray="4 3" marker-end="url(#arrow-muted)"/>
  <text x="300" y="453" text-anchor="middle" fill="rgba(255,255,255,0.35)" font-size="9">deploy on push to main</text>

  <text x="490" y="590" text-anchor="middle" fill="rgba(255,255,255,0.3)" font-size="10">Solid arrows = request/data path · dashed = deploy or telemetry</text>
</svg>
